# Builds the Becca Nena POS desktop app (desktop/ folder).
#
# Run it from GitHub: Actions → "Desktop app" → Run workflow. When it finishes,
# download the installer from the run's "Artifacts" section. It also runs by
# itself whenever something in desktop/ changes on main.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-app.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Becca-Nena-POS-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Becca-Nena-POS-Mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
