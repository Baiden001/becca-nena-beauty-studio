<!doctype html>
<html lang="en-GH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#302827">
  <title>BN POS · Offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #F8F4EF; color: #302827;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { max-width: 420px; text-align: center; }
    img { height: 64px; width: auto; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: 28px; margin: 24px 0 8px; }
    p { color: #766866; line-height: 1.5; margin: 0 0 8px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #c0392b; margin-right: 8px; vertical-align: middle; }
    .status { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: #766866; }
    button {
      margin-top: 24px; border: 0; border-radius: 999px; background: #302827; color: #F8F4EF;
      font: inherit; font-weight: 600; padding: 14px 32px; cursor: pointer;
    }
    button:hover { background: #A98282; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.png" alt="Becca Nena Beauty Studio">
    <h1>The till is offline</h1>
    <p class="status"><span class="dot"></span><span id="state">No internet connection</span></p>
    <p>Sales can't be recorded until the connection is back, because stock and prices live online. Check the Wi-Fi or mobile data.</p>
    <p>This page will reconnect by itself.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () {
      document.getElementById("state").textContent = "Back online, reconnecting…";
      location.reload();
    });
  </script>
</body>
</html>
