<!doctype html>
<html lang="en-GH">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Becca Nena POS · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F8F4EF; color: #302827;
      font-family: "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 440px; text-align: center; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: 30px; margin: 0 0 10px; }
    p { color: #766866; line-height: 1.5; margin: 0 0 8px; }
    .status { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #c0392b; margin-right: 8px; }
    button { margin-top: 22px; border: 0; border-radius: 999px; background: #302827; color: #F8F4EF;
      font: inherit; font-weight: 600; padding: 14px 32px; cursor: pointer; }
    button:hover { background: #A98282; }
  </style>
</head>
<body>
  <main>
    <h1>The till can't reach the internet</h1>
    <p class="status"><span class="dot"></span><span id="state">Offline · retrying</span></p>
    <p>Sales need a connection because stock and prices live online. Check the Wi-Fi or mobile data. This screen tries again every 10 seconds.</p>
    <button type="button" id="retry">Try again now</button>
  </main>
  <script>
    var target = new URLSearchParams(location.search).get("retry") || "";
    function retry() { if (/^https?:\/\//.test(target)) location.href = target; }
    document.getElementById("retry").onclick = retry;
    window.addEventListener("online", retry);
    setInterval(function () { if (navigator.onLine) retry(); }, 10000);
  </script>
</body>
</html>
